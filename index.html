<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />
    <title>加入微信群</title>
    <link rel="stylesheet" href="./css/landing.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <p class="eyebrow">微信群</p>
        <h1>加入微信交流群</h1>
        <p class="hint">长按识别二维码，加入微信群</p>

        <div class="qr-wrap">
          <!-- 换图：替换仓库内 assets/group-qr.png 后推送到 GitHub 即可 -->
          <img
            class="qr-image"
            src="./assets/group-qr.jpg"
            alt="微信群二维码"
            width="280"
            height="280"
          />
        </div>

        <p class="tip">请在微信中打开本页，长按二维码即可识别</p>
      </section>
    </main>
  </body>
</html>
